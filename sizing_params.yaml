# =============================================================================
# Rubin Observatory USDF Sizing Model -- Tunable Parameters
# =============================================================================
# Edit numbers here; re-run generate_sizing_model.py to regenerate the xlsx.
# The Python script itself should never need editing.
# =============================================================================

# ---------------------------------------------------------------------------
# General
# ---------------------------------------------------------------------------
general:
  start_fiscal_year: 2026        # FY corresponding to LOY1
  num_loy: 10                    # LOY1 through LOY10
  scale_year: 2026               # year used as baseline for price factor scaling

# ---------------------------------------------------------------------------
# DRP Estimates (from DRP Resource Usage Estimates, Jim Bosch)
# Numbers calibrated against actual DP2 measurements and DR1 projections.
# ---------------------------------------------------------------------------
drp:
  # DRP core-hours = input_TB_per_year × cumulative_years × core_hours_per_input_TB
  # Calibrated so that 1 year of input (798 TB) × 20571 = 16.4M core-hours = DR1 actual.
  core_hours_per_input_tb: 20571   # DR1 actual: 16,416,000 ch / 798 TB input
  commissioning_carryover_ch: 0    # no carry-over assumed
  # Reference only (not used in formulas — sizing uses core_hours_per_input_tb):
  dr1_node_days: 5700              # legacy estimate; see DM-53697 section in DRP Resource Usage Estimates
  dp2_node_days: 970               # DP2 actual: 970 node-days @ 120 cores/node (~2.79M core-hours).
                                   # CORRECTED Aug 2026 from DP2 performance metrics (was 650).
                                   # DP2 was processed ENTIRELY on Milano nodes.
  torino_per_core_speedup: 2.0     # Rubin pipelines run ~2x faster per core on Torino vs Milano
                                   # across all tasks (+60% base clock, higher memory bandwidth).
                                   # Use for Milano-equivalent capacity accounting.
  document_cpu_reference: "DRP Resource Usage Estimates — CPU from DM-53697 (v30_0_0_rc2), DM-52836 (w_2025_41)"
  safety_margin: 1.5
  cores_per_node: 120
  # Task wall / CPU from DRP Resource Usage Estimates (DM stats). Does NOT include idle
  # between tasks, inter-stage evaluation, or calendar stretch (K-T Mar 2026 — CM to refine).
  wall_to_cpu_ratio: 1.14
  # Multiplier on DRP concurrent cores: same effect as lower “productive” hours in the
  # processing window. K-T: 1.14 is task-level only; inter-stage gaps are extra. Placeholder
  # between suggested 1.3–1.5 until CM supplies a value.
  idle_and_inter_stage_multiplier: 1.35
  processing_window_days: 200
  # Storage totals from DRP Resource Usage Estimates (with lossy compression):
  dp2_storage_total_pb: 7.43      # DP2 total DRP output (compressed, ~30k visits)
  dp2_storage_release_pb: 0.32    # DP2 release products (compressed)
  dr1_storage_total_pb: 47        # DR1 total DRP output (compressed, ~210k visits)
  dr1_storage_release_pb: 1.6     # DR1 release products (compressed)
  dr1_storage_nocomp_pb: 52       # DR1 total without compression (for reference)
  dr2_multiplier: 2.0

# ---------------------------------------------------------------------------
# Alert Production (from existing sizing spreadsheet Compute tab)
# ---------------------------------------------------------------------------
alert_production:
  ap_cores: 1188                 # alert production cores (Compute!$F$27)

# ---------------------------------------------------------------------------
# Compute Scaling Fractions
# ---------------------------------------------------------------------------
compute_fractions:
  dac_drp_fraction: 0.10         # DAC/LSP cores = 10% of DRP cores
  staff_dac_fraction: 0.10       # Staff LSP cores = 10% of DAC cores

# Developer / pilot / RSP-adjacent batch load (K-T Mar 2026: confirm with Yusra / CM;
# AOS and Solar System also use significant batch time).
developer_pilot:
  # Extra node-days of batch per survey year (spread from ~165 node-days “at present” / 3 yr).
  additional_node_days_per_year: 55
  # Added on top of DRP concurrent cores after idle multiplier (~1% USDF-RSP class load).
  usdf_rsp_extra_fraction_of_drp_concurrent: 0.01

# ---------------------------------------------------------------------------
# Prompt Products (RFC-1134)
# ---------------------------------------------------------------------------
prompt:
  tier1_tb_per_night: 5.6        # long-term retention (preliminary_visit_image + difference_image etc.)
  tier2_tb_per_night: 6.0        # short-term retention (30-day rolling)
  tier2_retention_days: 30
  dr1_target_year: 2027          # DR1 at LOY2 (~12-14 months after survey start) -- Tier 1 accumulates until this year

# ---------------------------------------------------------------------------
# Qserv (confirmed via #dm-qserv thread 2026-07-30, /proc/cpuinfo capture)
# Deployments Jul 2026: 35-node K8s prod + 35-node K8s int + 6-node Docker int.
# Most USDF K8s nodes share this hardware configuration.
# ---------------------------------------------------------------------------
qserv:
  current_nodes: 92              # Mar 2026 snapshot (15 Docker + 77 K8s v-cluster); Jul 2026: 35 prod K8s
  prod_nodes_dp2: 35             # K8s prod deployment serving DP2 (confirmed 2026-07-30)
  cpu_model: "AMD EPYC 7543P"    # single socket, confirmed from /proc/cpuinfo 2026-07-30
  cores_per_node: 32             # physical cores
  hardware_threads_per_node: 64  # HT enabled (siblings: 64)
  ram_gb_per_node: 256
  nvme_slots_populated: 12       # out of 24 total slots (half-populated; can double raw capacity)
  nvme_slots_total: 24
  storage_tb_per_node: 32        # raw, with 12 slots
  effective_tb_per_node: 64      # ~2x via ZFS automatic compression on data filesystems
  max_storage_tb_per_node: 64    # raw, if all 24 slots populated (~128 TB effective w/ ZFS)
  internal_network: "100 GbE"
  replication_factor: 3

# ---------------------------------------------------------------------------
# Observing Parameters (from Rubin Key Numbers spreadsheet)
# ---------------------------------------------------------------------------
observing:
  nights_per_year: 300             # assumed observing nights (2 wk planned + 2 wk unplanned outage)
  visits_per_night: 700            # sim-based: 2.1M visits / 10yr / 300 nights (was 1000 pre-ops)
  images_per_visit: 1              # snaps=1 per Rubin Key Numbers (was 2 during construction)
  calibration_images_per_day: 450  # from Rubin Key Numbers (was 500 pre-ops)
  engineering_fraction: 0.01       # engineering images = 1% of science images

# ---------------------------------------------------------------------------
# Image & Compression Parameters (from Rubin Key Numbers + DRP Resource Usage Estimates)
# ---------------------------------------------------------------------------
imaging:
  lsstcam_image_size_tb: 0.00819222      # 8.19 GB logical per exposure (Key Numbers row 24)
  raw_compression: 0.464                  # 3.8 GB on disk / 8.19 GB logical (Key Numbers rows 24,31)
  # LSST Key Numbers wiki: compressed cal ~2.3 GB/exposure vs ~3.8 GB on-sky raw → 2.3/8.19 logical
  calibration_compression: 0.281
  lossy_compression: 0.27                 # from DRP doc: compressed/uncompressed visit_image ratio
  # Per-visit DRP output constants from DRP Resource Usage Estimates (DR1 actual, uncompressed):
  output_image_tb_per_visit: 0.01906      # DR1 visit_image: 4,003 TB / 210k visits
  parquet_tb_per_visit: 0.00618           # DR1 non-image release: 1,297 TB / 210k visits
  # Legacy HSC ratio (kept for reference; no longer used in output formulas):
  lsstcam_to_hsc_ratio: 0.00936473464

# ---------------------------------------------------------------------------
# Storage Scaling Fractions and Constants
# ---------------------------------------------------------------------------
storage_fractions:
  apdb_reference_tb: 4.5           # APDB reference total TB (OSS-REQ-0190 baseline)
  apdb_reference_visits: 57000     # visits corresponding to the APDB reference TB
  # K-T: intermediates can be much larger than 10% today; belongs in total vs release story.
  # Placeholder until derived from Jim C. release vs intermediate split (DRP doc).
  scratch_fraction: 0.35
  misc_overhead_fraction: 0.20     # other/misc = 20% of per-year subtotal
  sims_output_tb: 5.0              # simulation output (constant per year)

